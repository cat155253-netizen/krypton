<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYPTON — Control Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600&family=Inter:wght@300;400;500;600;700&family=Permanent+Marker&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23124a5e'/%3E%3Cstop offset='1' stop-color='%233fa7c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-weight='600' font-size='38' text-anchor='middle' fill='%237fd0b5'%3EK%3C/text%3E%3C/svg%3E">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        deep:'#124a5e', ink:'#2c5f72', soft:'#5e8ea0', neon:'#3fa7c9', mint:'#7fd0b5',
      },
      fontFamily: {
        hand:['Permanent Marker','cursive'],
        serif:['Source Serif 4','Georgia','Times New Roman','serif'],
        mono:['JetBrains Mono','monospace'],
      },
    }
  }
};
</script>
<style>
  body{font-family:'Inter',sans-serif;background:#eef4f8}
  .sk-serif{font-family:'Source Serif 4',Georgia,'Times New Roman',serif}
  .mono{font-family:'JetBrains Mono',monospace}
  .btn-soft{background:linear-gradient(120deg,#3fa7c9,#5fc4b0);color:#fff;border-radius:999px;box-shadow:0 10px 24px rgba(63,167,201,.35);transition:.3s;font-weight:600;border:none;cursor:pointer}
  .btn-soft:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(63,167,201,.45)}
  .btn-ghost{background:transparent;border:1px solid rgba(63,167,201,.4);color:#3fa7c9;border-radius:999px;padding:.5em 1.1em;font-family:'JetBrains Mono',monospace;font-size:.72rem;cursor:pointer;transition:.2s}
  .btn-ghost:hover{background:#fff}
  .btn-danger{background:transparent;border:1px solid rgba(226,51,46,.4);color:#e2332e;border-radius:999px;padding:.5em 1.1em;font-family:'JetBrains Mono',monospace;font-size:.72rem;cursor:pointer;transition:.2s}
  .btn-danger:hover{background:rgba(226,51,46,.08)}
  .field{width:100%;border:1.5px solid rgba(63,167,201,.35);background:#fff;border-radius:14px;padding:.75rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#124a5e;outline:none;transition:.2s}
  .field:focus{border-color:#3fa7c9;box-shadow:0 0 0 4px rgba(63,167,201,.14)}
  .row-card{background:#fff;border:1px solid #e2edf3;border-radius:16px}
  .kfake{display:none}
</style>
</head>
<body class="min-h-screen">
<!-- ============ LOGIN VIEW ============ -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="marker text-4xl" style="font-family:'Permanent Marker',cursive;color:#124a5e">Krypton</div>
      <div class="mono text-[11px] tracking-[.35em] text-soft mt-1">CONTROL ROOM</div>
    </div>
    <div class="row-card p-8">
      <h2 class="sk-serif text-2xl font-semibold italic text-deep mb-1">Welcome back</h2>
      <p class="text-sm text-soft mb-6">Sign in to review applications.</p>
      <form id="loginForm" autocomplete="off">
        <input id="password" type="password" class="field mb-4" placeholder="Admin password" autocomplete="current-password">
        <p id="loginErr" class="hidden text-xs text-red-500 mb-3">Incorrect password. Try again.</p>
        <button type="submit" class="btn-soft w-full py-3 mono text-sm tracking-widest">UNLOCK</button>
      </form>
      <p class="text-center mt-5"><a href="/krypton.html" class="text-xs mono text-neon hover:underline">← back to Krypton site</a></p>
    </div>
  </div>
</div>

<!-- ============ DASHBOARD VIEW ============ -->
<div id="dashView" class="hidden">
  <header class="bg-white/80 backdrop-blur sticky top-0 z-40 border-b border-[#e2edf3]">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <span class="marker text-2xl text-deep" style="font-family:'Permanent Marker',cursive">Krypton</span>
        <span class="mono text-[10px] tracking-[.3em] text-neon ml-3">CONTROL ROOM</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="mono text-[11px] text-soft" id="liveCount">—</span>
        <a href="/krypton.html" class="btn-ghost">SITE</a>
        <button class="btn-ghost" onclick="doLogout()">LOG OUT</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div class="flex items-end justify-between mb-6">
      <div>
        <h1 class="sk-serif text-3xl font-semibold italic text-deep">Applications</h1>
        <p class="text-sm text-soft mt-1">Every submission, stored and ready.</p>
      </div>
      <button class="btn-ghost" onclick="refresh()">⟳ REFRESH</button>
    </div>

    <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
    <div id="list" class="space-y-4"></div>
    <p id="empty" class="hidden text-center py-16 hand text-2xl text-soft">No applications yet — they'll land here as they submit.</p>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function json(url, opts) {
  const r = await fetch(url, Object.assign({}, opts, { headers: { 'Content-Type': 'application/json' } }));
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

function money(n) {
  if (n === 0 || n == null) return '$0';
  return '$' + Number(n).toLocaleString('en-US');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
}

function statCard(label, value, acc) {
  return `<div class="row-card p-5" style="border-top:3px solid ${acc}">
    <div class="mono text-[10px] tracking-[.2em] text-soft uppercase">${label}</div>
    <div class="text-3xl font-bold text-deep mt-1">${value}</div>
  </div>`;
}

function renderStats(apps) {
  const total = apps.length;
  const newCount = apps.filter(a => a.status === 'new').length;
  const totalValue = apps.reduce((s, a) => s + (Number(a.totalUSD) || 0), 0);
  $('stats').innerHTML =
    statCard('Total', total, '#3fa7c9') +
    statCard('Pending', newCount, '#e0783a') +
    statCard('Pipeline value', money(totalValue), '#7fd0b5') +
    statCard('Status', 'Live', '#e85b9c');
  $('liveCount').textContent = total + ' applications';
}

function addOnsText(a) {
  const list = Array.isArray(a.addOns) ? a.addOns : [];
  return list.length ? list.map(x => x.name + ' (+' + money(x.cost) + ')').join('<br>') : '—';
}

function appCard(a) {
  const newBadge = a.status === 'new'
    ? '<span class="mono text-[10px] px-2 py-0.5 rounded-full" style="color:#e0783a;background:#e0783a18;border:1px solid #e0783a55">NEW</span>'
    : '<span class="mono text-[10px] px-2 py-0.5 rounded-full" style="color:#2c5f72;background:#2c5f7214;border:1px solid #2c5f7233">OPEN</span>';
  return `
  <article class="row-card p-6">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="flex items-center gap-3 flex-wrap">
          <h3 class="sk-serif text-xl font-semibold italic text-deep">${escapeHtml(a.company || a.applicant || 'Company')}</h3>${newBadge}
        </div>
        <p class="text-sm text-soft mt-1">${escapeHtml(a.applicant || '—')}${a.post ? ' · ' + escapeHtml(a.post) : ''} · ${escapeHtml(a.founderEmail || '—')}</p>
      </div>
      <div class="text-right">
        <div class="text-2xl font-bold text-deep">${money(a.totalUSD)}</div>
        <div class="mono text-[10px] text-neon tracking-widest mt-1">${escapeHtml((a.appNo || ''))} · ${escapeHtml((a.appId || ''))}</div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-x-8 gap-y-2 mt-5 text-sm">
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Theme</span><span class="text-deep text-right">${escapeHtml(a.theme || '—')}</span></div>
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Pages</span><span class="text-deep text-right">${escapeHtml(a.lengthSelection || '—')}</span></div>
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Style</span><span class="text-deep text-right">${escapeHtml(a.styleSelection || '—')}</span></div>
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Delivery format</span><span class="text-deep text-right">${escapeHtml(a.deliveryFormat || '—')}</span></div>
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Speed</span><span class="text-deep text-right">${escapeHtml(a.deliverySpeed || '—')}</span></div>
      <div class="flex justify-between gap-4"><span class="mono text-[11px] text-soft uppercase tracking-widest">Submitted</span><span class="text-deep text-right">${fmtDate(a.createdAt)}</span></div>
    </div>

    <div class="mt-6 pt-4 border-t border-[#e2edf3] flex flex-wrap items-center justify-between gap-3">
      <div class="mono text-[11px] text-soft">PASSCODE &nbsp;<span class="tracking-[.25em] text-deep">${escapeHtml(String(a.appCode || ''))}</span></div>
      <div class="flex gap-2">
        <button class="btn-ghost" onclick="resendNow(${a.id}, this)">⟶ RESEND EMAIL</button>
        <button class="btn-danger" onclick="deleteApp(${a.id}, this)">DELETE</button>
      </div>
    </div>
  </article>`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function refresh() {
  const { status, data } = await json('/api/applications');
  if (status !== 200) { location.reload(); return; }
  const apps = data.applications || [];
  renderStats(apps);
  if (!apps.length) {
    $('empty').classList.remove('hidden');
    $('list').innerHTML = '';
    return;
  }
  $('empty').classList.add('hidden');
  $('list').innerHTML = apps.map(appCard).join('');
}

async function resendNow(id, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'SENDING…';
  const { status, data } = await json('/api/applications/' + id + '/resend', { method: 'POST' });
  btn.disabled = false;
  btn.textContent = status === 200 ? 'RESENT ✓' : 'FAILED — ' + ((data && data.error) || '');
  if (status === 200) setTimeout(() => { btn.textContent = '⟶ RESEND EMAIL'; }, 2500);
}

async function deleteApp(id, btn) {
  if (!confirm('Delete this application permanently?')) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = '…';
  const { status } = await json('/api/applications/' + id, { method: 'DELETE' });
  btn.disabled = false; btn.textContent = old;
  if (status === 200) refresh();
}

async function doLogout() {
  await json('/api/logout', { method: 'POST' });
  location.reload();
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginForm').querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '…';
  const { status, data } = await json('/api/login', { method: 'POST', body: JSON.stringify({ password: $('password').value }) });
  btn.disabled = false; btn.textContent = 'UNLOCK';
  if (status === 200) { showDash(); return; }
  $('loginErr').textContent = (data && data.error) || 'Login failed.';
  $('loginErr').classList.remove('hidden');
});

async function showDash() {
  $('loginView').classList.add('hidden');
  $('dashView').classList.remove('hidden');
  refresh();
  setInterval(refresh, 30_000);
}

(async function boot() {
  const { status } = await json('/api/session');
  if (status === 200) { showDash(); return; }
  $('loginView').classList.remove('hidden');
})();
</script>
</body>
</html>
